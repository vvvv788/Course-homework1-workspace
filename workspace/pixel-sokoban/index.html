<meta charset="UTF-8" data-page-node-id="HyL2PRhv9kyA5bWqONpRFE" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" data-page-node-id="QW0w9aIFurW9nFJyT3H0Ke" />

<title>像素推箱子 · Pixel Sokoban</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');

  :root {
    --bg:        #1d1a14;
    --panel:     #2c2820;
    --panel-l:   #4a4438;
    --panel-d:   #15130e;
    --accent:    #f4a259;
    --accent-d:  #c06b1f;
    --accent2:   #7cb342;
    --text:      #f5ecd9;
    --muted:     #a89a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', 'ZCOOL KuaiLe', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #game {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 18% 28%, rgba(80,60,30,0.35) 0, transparent 42%),
      radial-gradient(circle at 82% 72%, rgba(80,60,30,0.30) 0, transparent 42%),
      var(--bg);
    padding: 12px;
  }

  /* ---- Screens ---- */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 680px;
    text-align: center;
    gap: 10px;
  }
  .screen.active { display: flex; }

  .overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,8,4,0.82);
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 16px;
  }
  .overlay.active { display: flex; }
  .overlay-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    max-width: 460px;
    border: 4px solid var(--panel-l);
    box-shadow: 0 0 0 4px var(--panel-d), 0 10px 30px rgba(0,0,0,0.6);
    background: var(--panel);
    padding: 26px 22px;
    border-radius: 2px;
  }

  /* ---- Title ---- */
  .title {
    font-family: 'ZCOOL KuaiLe', sans-serif;
    font-size: clamp(40px, 9vw, 70px);
    color: var(--accent);
    text-shadow: 4px 4px 0 var(--accent-d), 8px 8px 0 rgba(0,0,0,0.45);
    letter-spacing: 4px;
    line-height: 1.1;
  }
  .title.sm { font-size: clamp(26px, 6vw, 40px); }
  .subtitle {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2.2vw, 14px);
    color: var(--muted);
    letter-spacing: 2px;
    line-height: 1.6;
  }

  /* ---- Buttons ---- */
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: none;
    border-top: 4px solid var(--panel-l);
    border-left: 4px solid var(--panel-l);
    border-right: 4px solid var(--panel-d);
    border-bottom: 4px solid var(--panel-d);
    padding: 13px 18px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: filter .08s, transform .05s;
    min-width: 150px;
  }
  .btn:hover { filter: brightness(1.18); }
  .btn:active { transform: translateY(2px); }
  .btn-primary {
    background: var(--accent);
    color: #2a1a0a;
    border-top-color: #ffd9a0;
    border-left-color: #ffd9a0;
    border-right-color: var(--accent-d);
    border-bottom-color: var(--accent-d);
    font-size: 14px;
    padding: 16px 26px;
  }
  .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  /* ---- HUD ---- */
  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 620px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    flex-wrap: wrap;
  }
  .hud-stats { display: flex; gap: 16px; }
  .hud-stat { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .hud-stat .label { color: var(--muted); font-size: 8px; }
  .hud-stat .value { color: var(--accent); font-size: 15px; }
  .hud-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .icon-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    background: var(--panel);
    color: var(--text);
    border: 3px solid var(--panel-d);
    border-top-color: var(--panel-l);
    border-left-color: var(--panel-l);
    padding: 9px 10px;
    cursor: pointer;
    min-width: 46px;
  }
  .icon-btn:hover { filter: brightness(1.25); }
  .icon-btn:active { transform: translateY(2px); }

  /* ---- Canvas frame ---- */
  #canvas-wrap {
    position: relative;
    padding: 8px;
    background: #0d0b07;
    border: 4px solid var(--panel-l);
    box-shadow: 0 0 0 4px var(--panel-d), 0 8px 24px rgba(0,0,0,0.55);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }

  /* ---- D-pad (mobile) ---- */
  #dpad {
    display: none;
    margin-top: 14px;
    width: 168px;
    height: 168px;
    position: relative;
  }
  @media (hover: none) and (pointer: coarse) { #dpad { display: block; } }
  .dpad-btn {
    position: absolute;
    width: 56px; height: 56px;
    background: var(--panel);
    color: var(--accent);
    border: 3px solid var(--panel-d);
    border-top-color: var(--panel-l);
    border-left-color: var(--panel-l);
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .dpad-btn:active { filter: brightness(1.5); transform: translateY(1px); }
  #dpad-up    { top: 0; left: 56px; }
  #dpad-down  { bottom: 0; left: 56px; }
  #dpad-left  { top: 56px; left: 0; }
  #dpad-right { top: 56px; right: 0; }

  /* ---- Level select ---- */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 12px 0 6px;
    width: 100%;
    max-width: 420px;
  }
  .level-cell {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    padding: 18px 6px;
    background: var(--panel);
    color: var(--text);
    border: 3px solid var(--panel-d);
    border-top-color: var(--panel-l);
    border-left-color: var(--panel-l);
    cursor: pointer;
    text-align: center;
  }
  .level-cell:hover { filter: brightness(1.2); }
  .level-cell .best { font-size: 7px; color: var(--accent2); margin-top: 8px; letter-spacing: 1px; }

  .hint {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-top: 16px;
    line-height: 1.9;
  }
  .stars { font-size: 24px; letter-spacing: 6px; color: #ffd166; min-height: 28px; }
  .star-on { color: #ffd166; }
  .star-off { color: #4a4438; }
  .credit {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--muted);
    margin-top: 18px;
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    #hud { font-size: 9px; gap: 6px; }
    .hud-stat .value { font-size: 13px; }
    .hud-stats { gap: 10px; }
    .icon-btn { padding: 8px 8px; font-size: 8px; min-width: 40px; }
  }
</style>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  关卡数据 (Classic Sokoban notation)
   *    #  墙     .  目标点     $  箱子
   *    @  玩家   *  箱子在目标  +  玩家在目标
   * ========================================================= */
  const LEVELS = [
    // 1 — 双子：两箱直线推（入门，10×9）
    [ "##########",
      "#        #",
      "#  .  .  #",
      "#        #",
      "#  $  $  #",
      "#        #",
      "#   @    #",
      "#        #",
      "##########" ],
    // 2 — 转角：单箱绕一个弯（9×9）
    [ "#########",
      "#.      #",
      "#       #",
      "#       #",
      "#   $   #",
      "#       #",
      "#       #",
      "#      @#",
      "#########" ],
    // 3 — 三连：三箱齐推，需注意顺序（10×9）
    [ "##########",
      "#        #",
      "#  ...   #",
      "#        #",
      "#  $$$   #",
      "#        #",
      "#   @    #",
      "#        #",
      "##########" ],
    // 4 — 四角：四箱送四角，地图更大（11×11）
    [ "###########",
      "#  .   .  #",
      "#         #",
      "#  $   $  #",
      "#         #",
      "#    @    #",
      "#         #",
      "#  $   $  #",
      "#         #",
      "#  .   .  #",
      "###########" ],
    // 5 — 墙后：两箱绕墙送上去，引入绕行（11×11）
    [ "###########",
      "#         #",
      "#  .   .  #",
      "#         #",
      "#  #   #  #",
      "#         #",
      "#  $   $  #",
      "#         #",
      "#    @    #",
      "#         #",
      "###########" ],
    // 6 — 绕柱：四箱绕立柱，上下双向绕行（12×12）
    [ "############",
      "#          #",
      "#  .    .  #",
      "#          #",
      "#  #    #  #",
      "#  $    $  #",
      "#          #",
      "#  $    $  #",
      "#  #    #  #",
      "#          #",
      "#  .    .  #",
      "#     @    #",
      "############" ],
    // 7 — 储藏：六箱绕墙，密度提升（13×12）
    [ "#############",
      "#           #",
      "#  .  .  .  #",
      "#           #",
      "#  #  #  #  #",
      "#  $  $  $  #",
      "#           #",
      "#  $  $  $  #",
      "#  #  #  #  #",
      "#  .  .  .  #",
      "#     @     #",
      "#############" ],
    // 8 — 终局：六箱长程绕行，最大地图（13×14）
    [ "#############",
      "#           #",
      "#  .  .  .  #",
      "#           #",
      "#  #  #  #  #",
      "#  $  $  $  #",
      "#           #",
      "#     @     #",
      "#           #",
      "#  $  $  $  #",
      "#  #  #  #  #",
      "#           #",
      "#  .  .  .  #",
      "#############" ],

    // 9 — 传送带入门：把箱子推上传送带，它会自动滑到目标（9×6）
    [ "#########",
      "#       #",
      "#  $>>>.#",
      "#       #",
      "#   @   #",
      "#########" ],
    // 10 — 开关+门：踩下开关打开门，再把箱子推过去（7×7）
    [ "#######",
      "#@    #",
      "#  S  #",
      "#     #",
      "# $ D .#",
      "#     #",
      "#######" ],
    // 11 — 彩色箱：红箱进红点、蓝箱进蓝点（7×6）
    [ "#######",
      "#     #",
      "# 1 a #",
      "# 2 b #",
      "#  @  #",
      "#######" ],
    // 12 — 传送门入门：走进传送门，从另一头出来（9×6）
    [ "#########",
      "#@  # P #",
      "#   # $ #",
      "# P # . #",
      "#   #   #",
      "#########" ],
    // 13 — 传送带+开关：先开门，再让传送带送箱（10×8）
    [ "##########",
      "#        #",
      "# $D>>>. #",
      "#        #",
      "#   S    #",
      "#   @    #",
      "#        #",
      "##########" ],
    // 14 — 彩色+传送门：用传送门到对岸，分色归位（9×6）
    [ "#########",
      "#@  #  P#",
      "#   #21 #",
      "# P #ba #",
      "#   #   #",
      "#########" ],
    // 15 — 传送门+开关：过门取开关，开道送箱（9×7）
    [ "#########",
      "#   # P #",
      "#P  # $ #",
      "#@  # D #",
      "#S  # . #",
      "#   #   #",
      "#########" ],
    // 16 — 终章：传送带+彩色+开关三合一（13×8）
    [ "#############",
      "#@     #     #",
      "#     D 1>>a#",
      "#  S  #     #",
      "#     D 2>>b#",
      "#     #     #",
      "#     #     #",
      "#############" ],
  ];

  /* =========================================================
   *  目标步数 PAR（拿 3 星所需的步数上限，2 星为 1.5 倍）
   *   由 BFS 求解器的最小推箱步数 + 走位余量估算
   * ========================================================= */
  // PAR[0..7] 由 BFS 求解器的最小推箱步数估算；[8..15] 为道具关，按手工通关步数 + 余量估算
  const PAR = [14, 20, 22, 52, 36, 72, 104, 120, 6, 12, 16, 5, 10, 10, 6, 20];

  /* =========================================================
   *  玩家像素 Sprite (8x8)
   *    . 透明   2 皮肤   3 头发   4 衣服   E 眼睛
   * ========================================================= */
  const SPR_PLAYER = [
    "..3333..",
    ".333333.",
    ".222222.",
    ".2E22E2.",
    ".222222.",
    "..4444..",
    ".444444.",
    ".4....4.",
  ];
  const PAL_PLAYER = { '2':'#f1c0a0', '3':'#5a3a22', '4':'#e63946', 'E':'#1a1a2a' };

  /* =========================================================
   *  DOM
   * ========================================================= */
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');

  /* =========================================================
   *  状态
   * ========================================================= */
  let state = null;        // 当前关卡状态
  let levelIndex = 0;
  let screen = 'start';
  let muted = false;
  let paused = false;     // 过场遮罩时锁定输入
  let replaying = false;   // 重玩记录播放中：锁定手动输入
  let anim = null;         // 移动动画
  let rafId = null;
  let lastT = 0;
  let pulse = 0;           // 目标点呼吸动画相位

  /* =========================================================
   *  音效 (Web Audio, 纯生成无需文件)
   * ========================================================= */
  let audioCtx = null;
  function beep(freq, dur, type='square', vol=0.08) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const SFX = {
    move:  () => beep(220, 0.05, 'square', 0.04),
    push:  () => beep(140, 0.09, 'sawtooth', 0.06),
    undo:  () => beep(180, 0.06, 'triangle', 0.05),
    win:   () => { beep(523,0.10,'square',0.08); setTimeout(()=>beep(659,0.10,'square',0.08),90); setTimeout(()=>beep(784,0.18,'square',0.08),180); },
    click: () => beep(330, 0.04, 'square', 0.04),
  };

  /* =========================================================
   *  最佳步数存储
   * ========================================================= */
  const BEST_KEY = 'pixelSokobanBest_v1';
  function loadBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}'); } catch(e){ return {}; } }
  function saveBest(o){ try { localStorage.setItem(BEST_KEY, JSON.stringify(o)); } catch(e){} }
  let best = loadBest();

  /* =========================================================
   *  关卡解析（支持道具：传送带 / 开关 / 门 / 彩色 / 传送门）
   *  符号: # 墙  . 目标  $ 箱  @ 玩家  * 箱在目标  + 玩家在目标
   *        ^v<> 传送带(方向)  S 开关  D 门  P 传送门(成对)
   *        1/2/3 红/蓝/绿箱   a/b/c 红/蓝/绿目标
   * ========================================================= */
  function parseLevel(rowsArr) {
    const maxLen = Math.max(...rowsArr.map(r => r.length));
    const grid = [];
    const boxes = []; let player = null;
    const targets = []; const switches = []; const doors = []; const conveyors = []; const portals = [];
    for (let r = 0; r < rowsArr.length; r++) {
      const row = rowsArr[r]; const g = [];
      for (let c = 0; c < maxLen; c++) {
        const ch = c < row.length ? row[c] : '#';
        let cellChar = ' ';
        if (ch === '#') cellChar = '#';
        else if (ch === '.') { cellChar = '.'; targets.push({ r, c, color: 'n' }); }
        else if (ch === 'a') { cellChar = 'a'; targets.push({ r, c, color: 'r' }); }
        else if (ch === 'b') { cellChar = 'b'; targets.push({ r, c, color: 'b' }); }
        else if (ch === 'c') { cellChar = 'c'; targets.push({ r, c, color: 'g' }); }
        else if (ch === '@') { cellChar = ' '; player = { r, c }; }
        else if (ch === '+') { cellChar = '.'; player = { r, c }; targets.push({ r, c, color: 'n' }); }
        else if (ch === '$') { cellChar = ' '; boxes.push({ r, c, color: 'n' }); }
        else if (ch === '*') { cellChar = '.'; boxes.push({ r, c, color: 'n' }); targets.push({ r, c, color: 'n' }); }
        else if (ch === '1') { cellChar = ' '; boxes.push({ r, c, color: 'r' }); }
        else if (ch === '2') { cellChar = ' '; boxes.push({ r, c, color: 'b' }); }
        else if (ch === '3') { cellChar = ' '; boxes.push({ r, c, color: 'g' }); }
        else if (ch === 'S') { cellChar = 'S'; switches.push({ r, c, on: false }); }
        else if (ch === 'D') { cellChar = 'D'; doors.push({ r, c, open: false }); }
        else if (ch === '^') { cellChar = '^'; conveyors.push({ r, c, dir: [-1, 0] }); }
        else if (ch === 'v') { cellChar = 'v'; conveyors.push({ r, c, dir: [1, 0] }); }
        else if (ch === '<') { cellChar = '<'; conveyors.push({ r, c, dir: [0, -1] }); }
        else if (ch === '>') { cellChar = '>'; conveyors.push({ r, c, dir: [0, 1] }); }
        else if (ch === 'P') { cellChar = 'P'; portals.push({ r, c }); }
        g.push(cellChar);
      }
      grid.push(g);
    }
    return { rows: grid, boxes, player, targets, switches, doors, conveyors, portals, moves: 0, history: [], redoStack: [], movesList: [] };
  }
  function cell(s, r, c) {
    if (r < 0 || c < 0 || r >= s.rows.length) return '#';
    if (c >= s.rows[r].length) return '#';
    return s.rows[r][c];
  }
  function boxAt(s, r, c) { return s.boxes.find(b => b.r === r && b.c === c) || null; }
  function boxIndexAt(s, r, c) { return s.boxes.findIndex(b => b.r === r && b.c === c); }
  function switchAt(s, r, c) { return s.switches.find(x => x.r === r && x.c === c) || null; }
  function doorAt(s, r, c) { return s.doors.find(x => x.r === r && x.c === c) || null; }
  function conveyorAt(s, r, c) { return s.conveyors.find(x => x.r === r && x.c === c) || null; }
  function portalAt(s, r, c) { return s.portals.findIndex(p => p.r === r && p.c === c); }
  function targetAt(s, r, c) { return s.targets.find(t => t.r === r && t.c === c) || null; }
  function blocked(s, r, c) {
    if (r < 0 || c < 0 || r >= s.rows.length) return true;
    if (c >= s.rows[r].length) return true;
    if (s.rows[r][c] === '#') return true;
    const d = doorAt(s, r, c);
    if (d && !d.open) return true;
    return false;
  }
  function snapshot(s) {
    return {
      player: { r: s.player.r, c: s.player.c },
      boxes: s.boxes.map(b => ({ r: b.r, c: b.c, color: b.color })),
      sw: s.switches.map(x => x.on),
      dr: s.doors.map(x => x.open),
    };
  }
  function restore(s, snap) {
    s.player.r = snap.player.r; s.player.c = snap.player.c;
    s.boxes = snap.boxes.map(b => ({ r: b.r, c: b.c, color: b.color }));
    s.switches.forEach((x, i) => x.on = snap.sw[i]);
    s.doors.forEach((x, i) => x.open = snap.dr[i]);
  }
  function activateSwitch(s, r, c) {
    const sw = switchAt(s, r, c);
    if (sw) { sw.on = !sw.on; s.doors.forEach(d => d.open = sw.on); }
  }
  function teleportBox(s, b) {
    const pi = portalAt(s, b.r, b.c);
    if (pi === -1) return;
    const pp = (pi % 2 === 0) ? s.portals[pi + 1] : s.portals[pi - 1];
    if (pp && !blocked(s, pp.r, pp.c) && boxIndexAt(s, pp.r, pp.c) === -1 && !(s.player.r === pp.r && s.player.c === pp.c)) {
      b.r = pp.r; b.c = pp.c;
    }
  }
  function teleportPlayer(s) {
    const pi = portalAt(s, s.player.r, s.player.c);
    if (pi === -1) return;
    const pp = (pi % 2 === 0) ? s.portals[pi + 1] : s.portals[pi - 1];
    if (pp && !blocked(s, pp.r, pp.c) && boxIndexAt(s, pp.r, pp.c) === -1) {
      s.player.r = pp.r; s.player.c = pp.c;
    }
  }
  function settleBoxes(s) {
    let changed = true, iter = 0;
    while (changed && iter < 200) {
      changed = false; iter++;
      for (let i = 0; i < s.boxes.length; i++) {
        const b = s.boxes[i];
        const cv = conveyorAt(s, b.r, b.c);
        if (!cv) continue;
        const nr = b.r + cv.dir[0], nc = b.c + cv.dir[1];
        if (blocked(s, nr, nc)) continue;
        if (boxIndexAt(s, nr, nc) !== -1) continue;
        if (s.player.r === nr && s.player.c === nc) continue;
        b.r = nr; b.c = nc; changed = true;
        teleportBox(s, b);
        if (switchAt(s, b.r, b.c)) activateSwitch(s, b.r, b.c);
      }
    }
  }
  function pushHistory(s, pre, dir) {
    s.history.push({ pre, post: snapshot(s), dir });
    s.redoStack = [];
    s.movesList.push(dir);
  }
  function isWin(s) {
    for (const t of s.targets) {
      const b = s.boxes.find(b => b.r === t.r && b.c === t.c);
      if (!b || b.color !== t.color) return false;
    }
    return true;
  }

  /* =========================================================
   *  移动逻辑
   * ========================================================= */
  function tryMove(dr, dc) {
    if (anim || paused || screen !== 'playing') return;
    const s = state; if (!s) return;
    const nr = s.player.r + dr, nc = s.player.c + dc;
    if (blocked(s, nr, nc)) return;              // 墙 或 关闭的门
    const b = boxAt(s, nr, nc);
    const fromR = s.player.r, fromC = s.player.c;

    if (b) {
      // 推箱
      const br = b.r + dr, bc = b.c + dc;
      if (blocked(s, br, bc)) return;            // 箱子后面是墙 / 关着的门
      if (boxIndexAt(s, br, bc) !== -1) return;  // 箱子后面还是箱子
      const boxFromR = b.r, boxFromC = b.c;       // 推动前箱子的位置
      const pre = snapshot(s);
      b.r = br; b.c = bc;                         // 执行推动
      s.player.r = nr; s.player.c = nc;
      if (switchAt(s, br, bc)) activateSwitch(s, br, bc);  // 箱子压到开关
      settleBoxes(s);                            // 传送带搬运 + 连锁开关 / 传送门
      teleportPlayer(s);                         // 玩家若走上传送门则传送
      pushHistory(s, pre, [dr, dc]);
      s.moves++;
      anim = { fromR, fromC, toR: s.player.r, toC: s.player.c,
               box: { fromR: boxFromR, fromC: boxFromC, toR: b.r, toC: b.c, color: b.color },
               t: 0, dur: 95, push: true };
      SFX.push();
    } else {
      const pre = snapshot(s);
      s.player.r = nr; s.player.c = nc;
      if (switchAt(s, nr, nc)) activateSwitch(s, nr, nc);    // 玩家踩到开关
      teleportPlayer(s);                          // 玩家走上传送门
      pushHistory(s, pre, [dr, dc]);
      s.moves++;
      anim = { fromR, fromC, toR: s.player.r, toC: s.player.c, box: null, t: 0, dur: 75, push: false };
      SFX.move();
    }
    updateHUD();
  }

  function undo() {
    if (anim || paused || screen !== 'playing') return;
    const s = state; if (!s || !s.history.length) return;
    const last = s.history.pop();
    s.redoStack.push(last);
    restore(s, last.pre);                 // 回到本步走法之前
    s.moves = Math.max(0, s.moves - 1);
    if (s.movesList.length) s.movesList.pop();
    SFX.undo();
    updateHUD();
  }

  function redo() {
    if (anim || paused || screen !== 'playing') return;
    const s = state; if (!s || !s.redoStack.length) return;
    const last = s.redoStack.pop();
    restore(s, last.post);                // 重放到本步走法之后
    s.history.push(last);
    s.moves++;
    s.movesList.push(last.dir);
    SFX.move();
    updateHUD();
  }

  /* =========================================================
   *  主循环 (呼吸光 + 动画)
   * ========================================================= */
  function loop(now) {
    if (!rafId) return;
    const dt = Math.min(60, now - lastT); lastT = now;
    pulse += dt * 0.004;
    if (anim && state) {
      anim.t += dt;
      if (anim.t >= anim.dur) {
        anim = null;
        if (isWin(state)) onLevelComplete();
      }
    }
    if (state && screen === 'playing') render();
    rafId = requestAnimationFrame(loop);
  }
  function startLoop() { if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(loop); } }
  function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

  /* =========================================================
   *  渲染
   * ========================================================= */
  let TILE = 40;
  function computeTile() {
    const s = state; if (!s) return;
    const cols = s.rows[0].length, rows = s.rows.length;
    const maxW = Math.min(window.innerWidth - 48, 560);
    const maxH = Math.min(window.innerHeight - 230, 430);
    let t = Math.floor(Math.min(maxW / cols, maxH / rows));
    if (t < 20) t = 20; if (t > 48) t = 48;
    if (t !== TILE || canvas.width !== cols * t || canvas.height !== rows * t) {
      TILE = t; canvas.width = cols * t; canvas.height = rows * t;
    }
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 2); }

  function render() {
    if (!state) return;
    const s = state;
    computeTile();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 静态层：地板/墙/门/目标/开关/传送门/传送带
    for (let r = 0; r < s.rows.length; r++) {
      for (let c = 0; c < s.rows[r].length; c++) {
        const x = c * TILE, y = r * TILE;
        const ch = s.rows[r][c];
        if (ch === '#') { drawWall(x, y); continue; }
        drawFloor(x, y, r, c);
        const d = doorAt(s, r, c);
        if (d) { drawDoor(x, y, d.open); continue; }
        const t = targetAt(s, r, c);
        if (t) drawTarget(x, y, t.color);
        const sw = switchAt(s, r, c);
        if (sw) drawSwitch(x, y, sw.on);
        if (portalAt(s, r, c) !== -1) drawPortal(x, y, portalAt(s, r, c));
        const cv = conveyorAt(s, r, c);
        if (cv) drawConveyor(x, y, cv.dir);
      }
    }
    // 箱子（含彩色）
    for (const b of s.boxes) {
      if (anim && anim.box && b.r === anim.box.toR && b.c === anim.box.toC) continue;
      const t = targetAt(s, b.r, b.c);
      const onT = t && t.color === b.color;
      drawBox(b.c * TILE, b.r * TILE, onT, b.color);
    }
    // 动画中的箱子（插值）
    if (anim && anim.box) {
      const k = Math.min(1, anim.t / anim.dur);
      const e = easeOut(k);
      const r = anim.box.fromR + (anim.box.toR - anim.box.fromR) * e;
      const c = anim.box.fromC + (anim.box.toC - anim.box.fromC) * e;
      const t = targetAt(s, anim.box.toR, anim.box.toC);
      const onT = t && t.color === anim.box.color;
      drawBox(c * TILE, r * TILE, onT, anim.box.color);
    }
    // 玩家（插值）
    {
      let pr = s.player.r, pc = s.player.c;
      if (anim) {
        const k = Math.min(1, anim.t / anim.dur);
        const e = easeOut(k);
        pr = anim.fromR + (anim.toR - anim.fromR) * e;
        pc = anim.fromC + (anim.toC - anim.fromC) * e;
      }
      drawPlayer(pc * TILE, pr * TILE);
    }
  }

  function drawFloor(x, y, r, c) {
    const base = ((r + c) % 2 === 0) ? '#c9a876' : '#bfa070';
    ctx.fillStyle = base; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(x + TILE * 0.2, y + TILE * 0.15, Math.max(2, TILE * 0.07), Math.max(2, TILE * 0.07));
    ctx.fillRect(x + TILE * 0.7, y + TILE * 0.6,  Math.max(2, TILE * 0.07), Math.max(2, TILE * 0.07));
  }
  function drawWall(x, y) {
    ctx.fillStyle = '#6b4226'; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#8b5a3c'; ctx.fillRect(x, y, TILE, Math.max(2, TILE * 0.13));
    ctx.fillStyle = '#4a2e1a'; ctx.fillRect(x, y + TILE - Math.max(2, TILE * 0.13), TILE, Math.max(2, TILE * 0.13));
    ctx.fillStyle = '#4a2e1a';
    ctx.fillRect(x + TILE * 0.5 - 1, y, 2, TILE);
    ctx.fillRect(x, y + TILE * 0.5 - 1, TILE * 0.5, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(x + TILE * 0.12, y + TILE * 0.62, Math.max(2, TILE * 0.08), Math.max(2, TILE * 0.08));
  }
  const TARGET_COLORS = {
    n: ['#e9c46a', '#f4a259'],
    r: ['#ff6b6b', '#ffd1d1'],
    b: ['#4d96ff', '#cfe2ff'],
    g: ['#51cf66', '#d3f9d8']
  };
  function drawTarget(x, y, color) {
    color = color || 'n';
    const c = TARGET_COLORS[color] || TARGET_COLORS.n;
    const cx = x + TILE / 2, cy = y + TILE / 2;
    const g = Math.sin(pulse) * 0.3 + 0.7;
    ctx.save();
    ctx.globalAlpha = 0.45 * g;
    ctx.fillStyle = c[0];
    const rr = TILE * 0.28;
    ctx.beginPath();
    ctx.moveTo(cx, cy - rr); ctx.lineTo(cx + rr, cy);
    ctx.lineTo(cx, cy + rr); ctx.lineTo(cx - rr, cy);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = g;
    ctx.fillStyle = c[1];
    ctx.fillRect(cx - 2, cy - 2, 4, 4);
    ctx.restore();
  }
  const BOX_COLORS = {
    n: { base: '#c08552', dark: '#6f4317', lite: '#d49a6a' },
    r: { base: '#e8504e', dark: '#8e2420', lite: '#ff8a87' },
    b: { base: '#3d7fd6', dark: '#1d3f78', lite: '#82b1f5' },
    g: { base: '#3fb950', dark: '#1d6b2a', lite: '#8ce29a' }
  };
  function drawBox(x, y, onTarget, color) {
    const pal = BOX_COLORS[color] || BOX_COLORS.n;
    const pad = Math.max(2, TILE * 0.08);
    const bx = x + pad, by = y + pad, bs = TILE - pad * 2;
    ctx.fillStyle = pal.dark; ctx.fillRect(bx, by, bs, bs);
    ctx.fillStyle = pal.base; ctx.fillRect(bx + 2, by + 2, bs - 4, bs - 4);
    ctx.fillStyle = pal.lite; ctx.fillRect(bx + 2, by + 2, bs - 4, Math.max(2, bs * 0.12));
    ctx.strokeStyle = pal.dark; ctx.lineWidth = Math.max(2, TILE * 0.08);
    ctx.beginPath();
    ctx.moveTo(bx + 3, by + 3); ctx.lineTo(bx + bs - 3, by + bs - 3);
    ctx.moveTo(bx + bs - 3, by + 3); ctx.lineTo(bx + 3, by + bs - 3);
    ctx.stroke();
    ctx.fillStyle = pal.dark;
    const rv = Math.max(2, TILE * 0.06);
    ctx.fillRect(bx + 2, by + 2, rv, rv);
    ctx.fillRect(bx + bs - 2 - rv, by + 2, rv, rv);
    ctx.fillRect(bx + 2, by + bs - 2 - rv, rv, rv);
    ctx.fillRect(bx + bs - 2 - rv, by + bs - 2 - rv, rv, rv);
    if (onTarget) {
      ctx.strokeStyle = '#7cf06b'; ctx.lineWidth = Math.max(2, TILE * 0.06);
      ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
    }
  }
  function drawSwitch(x, y, on) {
    const cx = x + TILE / 2, cy = y + TILE / 2;
    ctx.fillStyle = on ? '#2e7d32' : '#555';
    ctx.beginPath(); ctx.arc(cx, cy, TILE * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = on ? '#a5ffa0' : '#999';
    ctx.beginPath(); ctx.arc(cx, cy, TILE * 0.16, 0, Math.PI * 2); ctx.fill();
    if (on) {
      ctx.strokeStyle = 'rgba(124,240,107,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, TILE * 0.4, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function drawDoor(x, y, open) {
    if (!open) {
      ctx.fillStyle = '#9aa3ad'; ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#6b7280';
      for (let i = 0; i < 3; i++)
        ctx.fillRect(x + TILE * 0.2, y + 4 + i * (TILE - 8) / 3, TILE * 0.6, Math.max(2, TILE * 0.08));
      ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 2; ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
    } else {
      ctx.fillStyle = 'rgba(124,240,107,0.18)';
      ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = 'rgba(124,240,107,0.7)'; ctx.lineWidth = Math.max(2, TILE * 0.06);
      ctx.strokeRect(x + 3, y + 3, TILE - 6, TILE - 6);
    }
  }
  function drawPortal(x, y, idx) {
    const cx = x + TILE / 2, cy = y + TILE / 2;
    const col = (idx % 2 === 0) ? '#b06bff' : '#ff9f43';
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, TILE * 0.06);
    for (let i = 0; i < 3; i++) {
      const rr = TILE * (0.12 + i * 0.09);
      ctx.globalAlpha = 0.8 - i * 0.2;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, pulse + i, pulse + i + Math.PI * 1.5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, TILE * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawConveyor(x, y, dir) {
    ctx.fillStyle = '#3a3f4b'; ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    for (let i = 0; i < 3; i++)
      ctx.fillRect(x + 4 + i * (TILE - 8) / 3, y + 4, Math.max(2, TILE * 0.05), TILE - 8);
    const cx = x + TILE / 2, cy = y + TILE / 2;
    const s = TILE * 0.18;
    ctx.fillStyle = '#ffd166';
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(dir[0], dir[1]));
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s, -s); ctx.lineTo(-s, s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawPlayer(x, y) {
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(x + TILE / 2, y + TILE - TILE * 0.1, TILE * 0.3, TILE * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();
    // 走路轻微上下抖动
    const bob = anim ? Math.sin((anim.t / anim.dur) * Math.PI) * (TILE * 0.04) : 0;
    const px = Math.max(2, Math.floor(TILE / 8));
    const sw = 8 * px;
    const ox = x + Math.floor((TILE - sw) / 2);
    const oy = y + Math.floor((TILE - sw) / 2) - bob;
    drawSprite(SPR_PLAYER, PAL_PLAYER, ox, oy, px);
  }
  function drawSprite(spr, pal, ox, oy, px) {
    for (let r = 0; r < spr.length; r++) {
      const row = spr[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.' || ch === ' ') continue;
        const col = pal[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(ox + c * px, oy + r * px, px, px);
      }
    }
  }

  /* =========================================================
   *  HUD / 屏幕
   * ========================================================= */
  function starsFor(moves, par) {
    if (moves <= par) return 3;
    if (moves <= Math.round(par * 1.5)) return 2;
    return 1;
  }
  function starString(n) {
    let s = '';
    for (let i = 0; i < 3; i++)
      s += i < n ? '<span class="star-on">★</span>' : '<span class="star-off">☆</span>';
    return s;
  }
  function totalStars() {
    let sum = 0;
    for (let i = 0; i < LEVELS.length; i++)
      if (best[i] != null) sum += starsFor(best[i], PAR[i]);
    return sum;
  }
  function updateMenuStars() {
    $('menu-stars').textContent = '★ ' + totalStars() + ' / ' + (LEVELS.length * 3) + ' STARS';
  }
  function updateHUD() {
    $('hud-level').textContent = (levelIndex + 1) + '/' + LEVELS.length;
    $('hud-moves').textContent = state ? state.moves : 0;
    $('hud-par').textContent = PAR[levelIndex] != null ? PAR[levelIndex] : '--';
    const curStars = state ? starsFor(state.moves, PAR[levelIndex]) : 3;
    $('hud-stars').innerHTML = starString(curStars);
    $('hud-best').textContent = best[levelIndex] != null ? best[levelIndex] : '--';
  }
  function showScreen(name) {
    screen = name;
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    if (name === 'start') { $('start-screen').classList.add('active'); updateMenuStars(); }
    else if (name === 'levels') { $('level-screen').classList.add('active'); buildLevelGrid(); }
    else if (name === 'playing') $('play-screen').classList.add('active');
    $('overlay-complete').classList.remove('active');
    $('overlay-victory').classList.remove('active');
    if (name === 'playing') startLoop(); else stopLoop();
  }
  function showOverlay(name) {
    if (name === 'complete') $('overlay-complete').classList.add('active');
    else if (name === 'victory') $('overlay-victory').classList.add('active');
  }
  function buildLevelGrid() {
    const grid = $('level-grid'); grid.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const cell = document.createElement('button');
      cell.className = 'level-cell';
      const b = best[i];
      const st = b != null ? starsFor(b, PAR[i]) : 0;
      cell.innerHTML = '<div>' + (i + 1) + '</div>' +
        (st > 0 ? '<div class="best">' + starString(st) + '</div>' : '') +
        (b != null ? '<div class="best" style="color:var(--muted);">BEST ' + b + '</div>' : '');
      cell.onclick = () => { SFX.click(); startLevel(i); };
      grid.appendChild(cell);
    });
  }
  function startLevel(i) {
    levelIndex = i;
    state = parseLevel(LEVELS[i]);
    anim = null; paused = false; replaying = false;
    stopLoop();
    showScreen('playing');
    updateHUD();
    render();
  }
  function replay() {
    if (anim || paused || replaying || screen !== 'playing') return;
    const s = state; if (!s || !s.movesList.length) { SFX.click(); return; }
    const seq = s.movesList.slice();
    replaying = true;
    startLevel(levelIndex); // 重置到初始局面
    let i = 0;
    function step() {
      if (i >= seq.length || screen !== 'playing') { replaying = false; return; }
      const [dr, dc] = seq[i++];
      tryMove(dr, dc);
      setTimeout(step, 170);
    }
    setTimeout(step, 260);
  }
  function onLevelComplete() {
    paused = true;
    SFX.win();
    const earned = starsFor(state.moves, PAR[levelIndex]);
    const prev = best[levelIndex];
    if (prev == null || state.moves < prev) { best[levelIndex] = state.moves; saveBest(best); }
    const isLast = levelIndex >= LEVELS.length - 1;
    $('complete-stars').innerHTML = starString(earned);
    $('complete-stats').textContent = 'MOVES ' + state.moves + ' · PAR ' + PAR[levelIndex] + (prev != null ? ' · BEST ' + Math.min(prev, state.moves) : '');
    updateHUD();
    if (isLast) showOverlay('victory'); else showOverlay('complete');
  }
  function restartLevel() { startLevel(levelIndex); }
  function nextLevel() {
    if (levelIndex < LEVELS.length - 1) startLevel(levelIndex + 1);
    else showScreen('start');
  }

  /* =========================================================
   *  输入
   * ========================================================= */
  const KEY_MAP = {
    ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1],
    w:[-1,0], s:[1,0], a:[0,-1], d:[0,1],
    W:[-1,0], S:[1,0], A:[0,-1], D:[0,1]
  };
  document.addEventListener('keydown', (e) => {
    if (screen === 'playing') {
      if (replaying) return;
      if (KEY_MAP[e.key]) { e.preventDefault(); tryMove(KEY_MAP[e.key][0], KEY_MAP[e.key][1]); }
      else if (e.key === 'r' || e.key === 'R') restartLevel();
      else if (e.key === 'u' || e.key === 'U') undo();
      else if (e.key === 'y' || e.key === 'Y') redo();
      else if (e.key === 'p' || e.key === 'P') replay();
      else if (e.key === 'Escape') showScreen('start');
    } else if (screen === 'start') {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startLevel(0); }
    }
  });

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (replaying) return;
    if (!touchStart || !e.changedTouches.length) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 20) { touchStart = null; return; }
    if (ax > ay) tryMove(0, dx > 0 ? 1 : -1);
    else tryMove(dy > 0 ? 1 : -1, 0);
    touchStart = null;
  }, { passive: true });

  // D-pad
  function bindDpad(id, dr, dc) { $(id).addEventListener('click', () => { if (!replaying) tryMove(dr, dc); }); }
  bindDpad('dpad-up', -1, 0); bindDpad('dpad-down', 1, 0);
  bindDpad('dpad-left', 0, -1); bindDpad('dpad-right', 0, 1);

  // 按钮
  $('btn-start').onclick         = () => { SFX.click(); startLevel(0); };
  $('btn-levels').onclick        = () => { SFX.click(); showScreen('levels'); };
  $('btn-back-menu').onclick     = () => { SFX.click(); showScreen('start'); };
  $('btn-undo').onclick          = () => { SFX.click(); undo(); };
  $('btn-redo').onclick          = () => { SFX.click(); redo(); };
  $('btn-replay').onclick        = () => { SFX.click(); replay(); };
  $('btn-restart').onclick       = () => { SFX.click(); restartLevel(); };
  $('btn-menu').onclick          = () => { SFX.click(); showScreen('start'); };
  $('btn-sound').onclick         = () => { muted = !muted; $('btn-sound').textContent = muted ? 'OFF' : 'SND'; SFX.click(); };
  $('btn-next').onclick          = () => { SFX.click(); nextLevel(); };
  $('btn-replay-level').onclick  = () => { SFX.click(); restartLevel(); };
  $('btn-restart-all').onclick   = () => { SFX.click(); startLevel(0); };
  $('btn-menu-victory').onclick  = () => { SFX.click(); showScreen('start'); };

  // 窗口尺寸变化
  window.addEventListener('resize', () => { if (state && screen === 'playing') render(); });

  // 初始化
  showScreen('start');
})();
</script>
</body>
</html>
